# Pubblica sulla ludoteca privata (Cloudflare R2 + Worker) i giochi costruiti di recente.
# I giochi non hanno segreti: lasciano su GitHub il pacchetto del sito e questo workflow lo prende e lo pubblica.
# Gira ogni due ore (GitHub tiene i pacchetti per un giorno) e si può avviare a mano da Actions.
name: Giochi su Cloudflare

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-giochi
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pubblica i giochi nuovi su Cloudflare
        env:
          LUDOTECA_TOKEN: ${{ secrets.LUDOTECA_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAX_GIOCHI: "30"
        run: python3 strumenti/giochi_r2.py
