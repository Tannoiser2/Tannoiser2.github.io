# Ricostruisce e pubblica la ludoteca.
# Cerca fra i repository di Tannoiser2 quelli con la cartella "ludoteca" (scheda.json + copertina.webp)
# e pubblica la pagina con l'elenco aggiornato. Gira ogni notte, a ogni modifica di questo repository
# e quando la si lancia a mano (Actions → Pubblica la ludoteca → Run workflow).
name: Pubblica la ludoteca
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Raccoglie i giochi dai repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 strumenti/costruisci.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
